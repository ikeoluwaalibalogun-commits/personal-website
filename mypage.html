<html>
<head>
    <link rel="stylesheet" href="./titlesection/titlesection.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gravitas+One&display=swap" rel="stylesheet"> 

    <style>
    * {
      box-sizing: border-box;
      font-family: "Gravitas One", serif;
      font-weight: 400;
      font-style: normal;
      color: pink;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    .main-section {
      width: 100vw;
      height: 100vh;
      background-size: cover;
      text-align: center;
      padding: 25px;
    }

    
    </style>
</head>
<body>
    <div class="main-section" id="title">
        <h1 class="title-section-header">Ikeoluwa Ali-Balogun</h1>
        <p class="title-section-subtitle">Empowering innovation, beauty, and impact through tech, strategy, and storytelling</p>
        <button class="title-section-button" onclick="makeDreamComeTrue()"> Let's Build Magic Together!</button>
    </div> 

    <script>
    function makeDreamComeTrue() {
        document.body.style.background = 'url("https://i.pinimg.com/originals/a4/df/73/a4df732fe01accd3aaa531fd6eeb2dfd.gif")';
        document.getElementById("title").style.visibility = "hidden";
    }
    </script>
</body>
</html>
